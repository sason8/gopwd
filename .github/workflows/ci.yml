name: Go CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        cache: true

    - name: Get Dependencies
      run: go mod download

    - name: Check Formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted! Run 'gofmt -w -s .'"
          gofmt -s -l .
          exit 1
        fi

    - name: Run Go Vet
      run: go vet ./...

    - name: Run Tests
      run: go test -v -race -coverprofile=coverage.out ./...
